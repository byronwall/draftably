name: Check

on:
  pull_request:

# Stop superseded PR checks from occupying runners needed by the replacement commit.
concurrency:
  group: check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check changesets and language documentation
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pnpm changeset:check "$BASE_SHA"
          pnpm skill:check "$BASE_SHA"
      - run: pnpm check:source
      - run: pnpm test:unit
