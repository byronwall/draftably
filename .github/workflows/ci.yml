name: Check

on:
  pull_request:
  push:
    branches: [main]

# Stop superseded PR checks from occupying runners needed by the replacement commit.
concurrency:
  group: check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-suite:
    name: check / ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: source
            run: pnpm check:source
          - suite: unit
            run: pnpm test:unit
          - suite: engines
            run: pnpm test:engines
          - suite: cli
            run: pnpm check:cli
          - suite: consumers
            run: pnpm check:consumers
          - suite: integrations
            run: pnpm runtime:build && pnpm check:integrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The changeset check compares the branch with its base.
          fetch-depth: ${{ matrix.suite == 'source' && '0' || '1' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Require a changeset for shipped changes
        if: matrix.suite == 'source' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset:check origin/${{ github.base_ref }}
      - name: Require a skill update for language changes
        if: matrix.suite == 'source' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm skill:check origin/${{ github.base_ref }}
      - run: ${{ matrix.run }}

  check:
    needs: check-suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check
        run: test "${{ needs.check-suite.result }}" = success

  proof-suite:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [site, frameworks, recipes]
        half: [1, 2]
        include:
          - suite: site
            build: pnpm site:bundle
            run: pnpm prove:site
          - suite: file
            build: pnpm bundle:viewer
            run: pnpm prove:file && pnpm prove:sequence && pnpm prove:layout
          - suite: runtime
            build: pnpm typecheck && pnpm runtime:pack-check && pnpm mermaid:build
            run: pnpm prove:runtime
          - suite: viewer
            build: pnpm runtime:build && pnpm viewer:pack-check
            run: pnpm prove:viewer && pnpm prove:element
          - suite: markdown
            build: pnpm runtime:build && pnpm markdown:build && pnpm markdown:pack-check
            run: pnpm markdown:browser-check
          - suite: hosts
            # Match playwright-core in pnpm-lock.yaml. This image includes WebKit’s system libraries.
            image: mcr.microsoft.com/playwright:v1.64.0-noble
            browsers: chromium firefox webkit
            build: pnpm runtime:build && pnpm editor:build
            run: |
              # Firefox requires the container user to own the Actions-mounted home directory.
              chown "$(id -u)" "$HOME"
              pnpm prove:slots &
              slots=$!
              pnpm prove:color-scheme
              wait "$slots"
          - suite: frameworks
            build: &framework_build pnpm runtime:build && pnpm editor:build && pnpm frameworks:build
            run: pnpm prove:frameworks
          - suite: recipes
            build: *framework_build
            run: pnpm prove:recipes
    name: proof / ${{ matrix.suite }} ${{ matrix.half }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Build packages and install browsers
        env:
          BROWSERS: ${{ matrix.browsers || 'chromium' }}
        run: |
          (
            for attempt in 1 2 3; do
              pnpm exec playwright-core install $BROWSERS && exit 0
              if [ "$attempt" -lt 3 ]; then sleep 30; fi
            done
            exit 1
          ) &
          install_pid=$!
          ( ${{ matrix.build }} ) || exit 1
          wait "$install_pid"
      - run: ${{ matrix.run }}
        env:
          PROOF_HALF: ${{ matrix.half }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proof-screenshots-${{ matrix.suite }}-${{ matrix.half }}
          path: |
            tmp/proof/
            tmp/proof-layout/
            tmp/proof-sequence/
            tmp/proof-site/
            tmp/proof-slots/
            tmp/proof-color-scheme/

  proofs:
    needs: proof-suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every proof suite
        run: test "${{ needs.proof-suite.result }}" = success

  bench:
    # A report, not a gate: times CLI commands and viewer actions against the 200 ms interactive
    # and 1 s load budgets and writes the table to the job summary. It runs on main only, so a
    # slow runner never marks a pull request red.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # The runner's apt mirror sometimes fails to resolve; retry before failing the job.
      - run: for i in 1 2 3; do pnpm exec playwright-core install --with-deps chromium && exit 0; sleep 30; done; exit 1
      - run: pnpm build
      - run: pnpm bench --runs 1

  markdown-action:
    # Runs actions/render-markdown twice on a fixture: the first run adds the SVGs and links, and
    # the second must change nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./actions/render-markdown
        with:
          files: integration-examples/markdown-action/**/*.md
      - name: Check the images and links
        working-directory: integration-examples/markdown-action
        run: |
          for svg in readme-1.svg checkout-flow.svg docs/guide-1.svg; do
            grep -q 'id="draftably-source"' "$svg" || { echo "::error::$svg has no embedded source"; exit 1; }
          done
          grep -Fqx '![Request path](readme-1.svg)' README.md
          grep -Fqx '![Cart, payment, then receipt.](checkout-flow.svg)' README.md
          grep -Fqx '![Diagram](guide-1.svg)' docs/guide.md
          test "$(grep -c '^<!-- draftably: ' README.md)" = 2
          git diff --stat
          git add -A
      - name: Rerun
        uses: ./actions/render-markdown
        with:
          files: integration-examples/markdown-action/**/*.md
      - name: Check the rerun changed nothing
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"

  host-proofs:
    # Builds the three pinned documentation hosts against fresh packed consumers.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm host:pack-check
