name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The changeset check compares the branch with its base.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Require a changeset for shipped changes
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset:check origin/${{ github.base_ref }}
      - name: Require a skill update for language changes
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm skill:check origin/${{ github.base_ref }}
      - run: pnpm release:check

  proofs:
    # Drives the real editor in Chromium against `draftably open`. Failure screenshots and
    # failure.json are uploaded as an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm site:build
      - run: pnpm runtime:build && pnpm runtime:pack-check && pnpm viewer:pack-check && pnpm prove:runtime && pnpm prove:viewer && pnpm prove:element && pnpm markdown:build && pnpm markdown:pack-check && pnpm markdown:browser-check && pnpm mermaid:build && pnpm frameworks:build && pnpm prove:frameworks
      - run: pnpm prove:file
      - run: pnpm prove:layout
      - run: pnpm prove:site
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proof-screenshots
          path: |
            tmp/proof/
            tmp/proof-layout/
            tmp/proof-site/

  bench:
    # A report, not a gate: times CLI commands and viewer actions against the 200 ms interactive
    # and 1 s load budgets and writes the table to the job summary.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm build
      - run: pnpm bench --runs 1

  host-proofs:
    # Builds the three pinned documentation hosts against fresh packed consumers.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm host:pack-check
