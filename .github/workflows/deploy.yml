name: Deploy to GitHub Pages

# The release workflow calls this after it publishes to npm, so the docs never describe a
# version that npm does not have. Run it by hand to ship a docs-only fix between releases.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm reads its version from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site (landing page, playground, docs) with the viewer build in app/.
      - run: pnpm site:build
        env:
          SITE_BASE: /
          SITE_ORIGIN: https://draftably.dev
          # Google Analytics stream for draftably.dev, the site and the app.
          GA_ID: G-QWRVCVQ70Z
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@v4
