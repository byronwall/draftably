name: Deploy the site to Cloudflare

# The release workflow calls this after it publishes to npm, so the docs never describe a
# version that npm does not have. Run it by hand to ship a docs-only fix between releases.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm reads its version from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site (landing page, playground, docs) with the viewer build in app/.
      - run: pnpm site:build
        env:
          SITE_BASE: /
          SITE_ORIGIN: https://draftably.dev
          # Google Analytics stream for draftably.dev, the site and the app.
          GA_ID: G-QWRVCVQ70Z
      # The draftably-site Worker serves dist-site at draftably.dev (site/wrangler.jsonc).
      - run: pnpm site:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
