name: Release

# A changeset opens the version PR. Merging that PR removes the changesets
# and starts the publish run. Ordinary commits do not start a release.
on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Open the Version Packages PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm run release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Byron Wall
          GIT_AUTHOR_EMAIL: byron@byroni.us
          GIT_COMMITTER_NAME: Byron Wall
          GIT_COMMITTER_EMAIL: byron@byroni.us
          NPM_CONFIG_PROVENANCE: true

  # The docs site goes out only after npm has the packages it describes.
  deploy:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
