name: Release

# A changeset opens the version PR. Merging that PR removes the changesets
# and starts the publish run. Ordinary commits do not start a release.
on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Open the Version Packages PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm run release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Match Product Grid: works for private source repositories too.
          NPM_CONFIG_PROVENANCE: false
