<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc">
<title id="title">Checkout service architecture</title>
<desc id="desc">Clients connect to an API gateway, which validates tokens with Auth service and sends requests to Order service. Order service reads and writes the Orders database and publishes to Queue. Queue feeds Worker, which updates Orders database.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker>
<style>
text { font-family: Arial, sans-serif; fill: #172b46; }
.group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
.node { fill: #fff; stroke: #345779; stroke-width: 2; }
.edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); stroke-linejoin: round; }
.label { font-size: 15px; paint-order: stroke; stroke: #f8fafc; stroke-width: 6px; stroke-linejoin: round; }
.name { font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
</style>
</defs>
<rect width="1280" height="690" fill="#fff"/>
<text x="40" y="53" font-size="28" font-weight="700">Checkout service architecture</text>
<rect class="group" x="40" y="100" width="220" height="540" rx="12"/>
<rect class="group" x="350" y="100" width="510" height="540" rx="12"/>
<rect class="group" x="960" y="100" width="290" height="540" rx="12"/>
<text x="60" y="135" font-size="19" font-weight="700">Client</text>
<text x="370" y="135" font-size="19" font-weight="700">Services</text>
<text x="980" y="135" font-size="19" font-weight="700">Data</text>
<!-- Eight directed connections, independently routed. -->
<path class="edge" d="M230 230 H310 V265 H400"/>
<path class="edge" d="M230 380 H330 V295 H400"/>
<path class="edge" d="M550 270 H600 V200 H650"/>
<path class="edge" d="M475 310 V380 H650"/>
<path class="edge" d="M830 370 H990"/>
<path class="edge" d="M740 350 V290 H1220 V575 H1170"/>
<path class="edge" d="M990 580 H830"/>
<path class="edge" d="M830 555 H900 V440 H1080 V410"/>
<!-- Exactly one visible node per required component. -->
<rect class="node" x="70" y="200" width="160" height="60" rx="8"/>
<text class="name" x="150" y="230">Web app</text>
<rect class="node" x="70" y="350" width="160" height="60" rx="8"/>
<text class="name" x="150" y="380">Mobile app</text>
<rect class="node" x="400" y="250" width="150" height="60" rx="8"/>
<text class="name" x="475" y="280">API gateway</text>
<rect class="node" x="650" y="170" width="180" height="60" rx="8"/>
<text class="name" x="740" y="200">Auth service</text>
<rect class="node" x="650" y="350" width="180" height="60" rx="8"/>
<text class="name" x="740" y="380">Order service</text>
<rect class="node" x="650" y="540" width="180" height="60" rx="8"/>
<text class="name" x="740" y="570">Worker</text>
<rect class="node" x="990" y="350" width="180" height="60" rx="8"/>
<text class="name" x="1080" y="380">Orders database</text>
<rect class="node" x="990" y="540" width="180" height="60" rx="8"/>
<text class="name" x="1080" y="570">Queue</text>
<text class="label" x="270" y="216">HTTPS</text>
<text class="label" x="267" y="402">HTTPS</text>
<text class="label" x="565" y="156">validate token</text>
<text class="label" x="525" y="368">request</text>
<text class="label" x="871" y="356">read/write</text>
<text class="label" x="1030" y="278">publish</text>
<text class="label" x="878" y="605">consume</text>
<text class="label" x="970" y="465">update</text>
</svg>
