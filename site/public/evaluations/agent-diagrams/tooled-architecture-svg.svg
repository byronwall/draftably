<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="46" text-anchor="middle" font-size="26" font-weight="bold" fill="#111827">Checkout service architecture</text>

  <!-- Groups -->
  <g stroke-width="1.5" stroke-dasharray="6 4">
    <rect x="30" y="80" width="190" height="460" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
    <rect x="250" y="80" width="430" height="460" rx="12" fill="#f0fdf4" stroke="#22c55e"/>
    <rect x="710" y="80" width="260" height="460" rx="12" fill="#fff7ed" stroke="#f97316"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="125" y="106" fill="#1d4ed8">Clients</text>
    <text x="465" y="106" fill="#15803d">Services</text>
    <text x="840" y="106" fill="#c2410c">Data</text>
  </g>

  <!-- Edges -->
  <g stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="195" y1="228" x2="280" y2="288"/>
    <line x1="195" y1="368" x2="280" y2="312"/>
    <path d="M345,270 V138 H520"/>
    <line x1="410" y1="300" x2="520" y2="300"/>
    <line x1="660" y1="285" x2="860" y2="285" marker-start="url(#arrow)"/>
    <line x1="660" y1="318" x2="765" y2="350"/>
    <line x1="765" y1="406" x2="660" y2="448"/>
    <line x1="660" y1="470" x2="860" y2="470"/>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="252" y="242">HTTPS</text>
    <text x="252" y="370">HTTPS</text>
    <text x="432" y="130">validate token</text>
    <text x="465" y="292">route</text>
    <text x="760" y="277">read / write</text>
    <text x="738" y="330">publish</text>
    <text x="748" y="438">consume</text>
    <text x="760" y="490">update</text>
  </g>

  <!-- Nodes -->
  <g font-size="14" text-anchor="middle" fill="#111827">
    <rect x="55" y="200" width="140" height="56" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="125" y="233">Web app</text>
    <rect x="55" y="340" width="140" height="56" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="125" y="373">Mobile app</text>

    <rect x="280" y="270" width="130" height="60" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="345" y="305">API gateway</text>
    <rect x="520" y="110" width="140" height="56" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="590" y="143">Auth service</text>
    <rect x="520" y="270" width="140" height="60" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="590" y="305">Order service</text>
    <rect x="520" y="430" width="140" height="56" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="590" y="463">Worker</text>

    <!-- Queue -->
    <rect x="730" y="350" width="110" height="56" rx="8" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
    <g stroke="#fdba74" stroke-width="1.5">
      <line x1="805" y1="356" x2="805" y2="400"/>
      <line x1="815" y1="356" x2="815" y2="400"/>
      <line x1="825" y1="356" x2="825" y2="400"/>
    </g>
    <text x="767" y="383">Queue</text>

    <!-- Orders database -->
    <path d="M860,132 V478 A45,12 0 0 0 950,478 V132" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
    <ellipse cx="905" cy="132" rx="45" ry="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <text x="905" y="372">Orders</text>
    <text x="905" y="390">database</text>
  </g>
</svg>
