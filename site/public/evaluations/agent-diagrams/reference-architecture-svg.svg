  <rect x="520" y="100" width="150" height="56" rx="6" fill="#fff" stroke="#333"/>
  <text x="595" y="133" text-anchor="middle" font-size="14">Auth service</text>
  <rect x="520" y="230" width="150" height="56" rx="6" fill="#fff" stroke="#333"/>
