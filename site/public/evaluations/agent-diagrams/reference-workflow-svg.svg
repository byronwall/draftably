<svg xmlns="http://www.w3.org/2000/svg" width="640" height="840" viewBox="0 0 640 840">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="840" fill="#fff"/>
  <text x="320" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">Order approval workflow</text>
  <g font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">
    <ellipse cx="260" cy="90" rx="60" ry="22" fill="#e3f2e1" stroke="#333"/>
    <text x="260" y="95">Start</text>
    <rect x="180" y="140" width="160" height="50" rx="6" fill="#fff" stroke="#333"/>
    <text x="260" y="170">Validate order</text>
    <polygon points="260,220 350,270 260,320 170,270" fill="#fff8e1" stroke="#333"/>
    <text x="260" y="266">Payment</text>
    <text x="260" y="284">authorized?</text>
    <rect x="180" y="360" width="160" height="50" rx="6" fill="#fff" stroke="#333"/>
    <text x="260" y="390">Reserve stock</text>
    <polygon points="260,440 350,490 260,540 170,490" fill="#fff8e1" stroke="#333"/>
    <text x="260" y="486">Stock</text>
    <text x="260" y="504">available?</text>
    <rect x="180" y="580" width="160" height="50" rx="6" fill="#fff" stroke="#333"/>
    <text x="260" y="610">Pack order</text>
    <rect x="180" y="670" width="160" height="50" rx="6" fill="#fff" stroke="#333"/>
    <text x="260" y="700">Ship order</text>
    <rect x="440" y="465" width="140" height="50" rx="6" fill="#fdecea" stroke="#333"/>
    <text x="510" y="495">Cancel order</text>
    <ellipse cx="260" cy="790" rx="60" ry="22" fill="#e3f2e1" stroke="#333"/>
    <text x="260" y="795">End</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="260" y1="112" x2="260" y2="140" marker-end="url(#arrow)"/>
    <line x1="260" y1="190" x2="260" y2="220" marker-end="url(#arrow)"/>
    <line x1="260" y1="320" x2="260" y2="360" marker-end="url(#arrow)"/>
    <line x1="260" y1="410" x2="260" y2="440" marker-end="url(#arrow)"/>
    <line x1="260" y1="540" x2="260" y2="580" marker-end="url(#arrow)"/>
    <line x1="260" y1="630" x2="260" y2="670" marker-end="url(#arrow)"/>
    <line x1="260" y1="720" x2="260" y2="768" marker-end="url(#arrow)"/>
    <path d="M350,270 H510 V465" marker-end="url(#arrow)"/>
    <line x1="350" y1="490" x2="440" y2="490" marker-end="url(#arrow)"/>
    <path d="M510,515 V790 H320" marker-end="url(#arrow)"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#555">
    <text x="268" y="345">Yes</text>
    <text x="268" y="565">Yes</text>
    <text x="370" y="262">No</text>
    <text x="370" y="482">No</text>
  </g>
</svg>
