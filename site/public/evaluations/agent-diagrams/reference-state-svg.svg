<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="#fff"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">Publishing state machine</text>

  <g font-family="sans-serif" font-size="13" fill="#444">
    <circle cx="50" cy="200" r="10" fill="#333"/>
    <line x1="60" y1="200" x2="90" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <line x1="230" y1="200" x2="320" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="275" y="192" text-anchor="middle">submit</text>

    <line x1="460" y1="200" x2="550" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="505" y="192" text-anchor="middle">approve</text>

    <line x1="690" y1="200" x2="780" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="735" y="192" text-anchor="middle">publish</text>

    <path d="M390,225 Q390,365 355,365" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="398" y="300" text-anchor="start">request edits</text>

    <path d="M195,365 Q180,365 180,225" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="192" y="300" text-anchor="start">revise</text>

    <path d="M620,175 C620,90 160,90 160,175" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="390" y="102" text-anchor="middle">withdraw</text>

    <line x1="850" y1="225" x2="850" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="860" y="287" text-anchor="start">archive</text>

    <path d="M850,390 V440 H120 V225" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="480" y="432" text-anchor="middle">restore</text>
  </g>

  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222">
    <rect x="90" y="175" width="140" height="50" rx="8" fill="#eef3fb" stroke="#333" stroke-width="1.5"/>
    <text x="160" y="205">Draft</text>

    <rect x="320" y="175" width="140" height="50" rx="8" fill="#fdf6e3" stroke="#333" stroke-width="1.5"/>
    <text x="390" y="205">In review</text>

    <rect x="550" y="175" width="140" height="50" rx="8" fill="#eaf7ec" stroke="#333" stroke-width="1.5"/>
    <text x="620" y="205">Approved</text>

    <rect x="780" y="175" width="140" height="50" rx="8" fill="#e6f4f7" stroke="#333" stroke-width="1.5"/>
    <text x="850" y="205">Published</text>

    <rect x="195" y="340" width="160" height="50" rx="8" fill="#fbecec" stroke="#333" stroke-width="1.5"/>
    <text x="275" y="370">Changes requested</text>

    <rect x="780" y="340" width="140" height="50" rx="8" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <text x="850" y="370">Archived</text>
  </g>
</svg>
