<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draftably in React Flow</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        font: 14px system-ui;
      }
      /* Draftably picks where each line meets its box, so React Flow's handle dots mislead. */
      .react-flow__handle {
        opacity: 0;
      }
      .status {
        position: absolute;
        z-index: 5;
        top: 12px;
        left: 12px;
        padding: 6px 10px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
