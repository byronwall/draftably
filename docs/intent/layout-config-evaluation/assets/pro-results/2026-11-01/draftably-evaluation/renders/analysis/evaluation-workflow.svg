<text x="66" y="327" class="head" text-anchor="start">Cold source rebuilds</text>
<text x="66" y="357" class="body" text-anchor="start">10 engines; meaningful directions</text>
<text x="66" y="382" class="body" text-anchor="start">Native recipes kept separate</text>
<text x="66" y="407" class="body" text-anchor="start">Full compile → route → labels</text>
<text x="66" y="432" class="body" text-anchor="start">Defaults + bounded preset search</text>
<rect x="425" y="295" width="350" height="146" rx="13" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.5"/>
<text x="445" y="327" class="head" text-anchor="start">Warm editing</text>
<text x="445" y="357" class="body" text-anchor="start">Shared prior positions and ports</text>
<text x="445" y="382" class="body" text-anchor="start">Pins, manual flags and scope</text>
<text x="445" y="407" class="body" text-anchor="start">Local repair vs global reflow</text>
<text x="445" y="432" class="body" text-anchor="start">Color controls retained</text>
<rect x="804" y="295" width="350" height="146" rx="13" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.5"/>
<text x="824" y="327" class="head" text-anchor="start">Routing experiments</text>
<text x="824" y="357" class="body" text-anchor="start">Fixed positions; 12 parameters</text>
<text x="824" y="382" class="body" text-anchor="start">Six interaction grids and ports</text>
<text x="824" y="407" class="body" text-anchor="start">Layout × routing cross-check</text>
<text x="824" y="432" class="body" text-anchor="start">History isolated by candidate</text>
<path d="M221 441V455H979V441 M600 441V455" fill="none" stroke="#62758a" stroke-width="2.4"/>
<path class="arrow" d="M410 455 L410 467"/>
<path class="arrow" d="M979 455 L979 467"/>
