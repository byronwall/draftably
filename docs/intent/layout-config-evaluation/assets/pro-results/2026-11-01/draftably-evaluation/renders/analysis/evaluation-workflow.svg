<text x="66" y="501" class="head" text-anchor="start">Hard validity before soft quality</text>
<text x="66" y="531" class="body" text-anchor="start">Objects, connections, finite geometry, pins, sides and supported scope</text>
<text x="66" y="556" class="body" text-anchor="start">Then visible score components, area, length, movement and runtime</text>
<text x="66" y="581" class="body" text-anchor="start">First terminal attempt wins; timeout checkpoints stay partial</text>
<text x="66" y="606" class="body" text-anchor="start">Metric coverage gaps remain explicit, with separate diagnostic audits</text>
<rect x="804" y="469" width="350" height="144" rx="13" fill="#eaf2fb" stroke="#c7d5e3" stroke-width="1.5"/>
<text x="824" y="501" class="head" text-anchor="start">Visual review</text>
<text x="824" y="531" class="body" text-anchor="start">Production SVG + browser PNG</text>
<text x="824" y="556" class="body" text-anchor="start">Matched, shuffled A/B pairs</text>
<text x="824" y="581" class="body" text-anchor="start">Judgments sealed before keys</text>
<text x="824" y="606" class="body" text-anchor="start">Single expert model; not users</text>
<path class="arrow" d="M410 613 L410 641 L600 641 L600 667"/>
<path class="arrow" d="M979 613 L979 641 L600 641"/>
<rect x="46" y="669" width="1108" height="96" rx="13" fill="#e4f3ed" stroke="#7ba995" stroke-width="1.5"/>
<text x="66" y="701" class="head" text-anchor="start">Freeze boundary — before heldout execution</text>
<text x="66" y="731" class="body" text-anchor="start">Metrics, practical bands, subsets, presets, selector trees, dependencies and routing choices sealed by hash</text>
<text x="66" y="756" class="body" text-anchor="start">Oracle availability is kept separate from a pre-layout selector and from user choice effort</text>
<path class="arrow" d="M600 765 L600 779 L313 779 L313 791"/>
<rect x="46" y="793" width="535" height="150" rx="13" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.5"/>
<text x="66" y="825" class="head" text-anchor="start">Fresh heldout assessment</text>
<text x="66" y="855" class="body" text-anchor="start">Apply frozen choices once; no refitting</text>
<text x="66" y="880" class="body" text-anchor="start">Common-job coverage + specialist escape + hard regressions</text>
<text x="66" y="905" class="body" text-anchor="start">Cluster uncertainty by base or family</text>
<text x="66" y="930" class="body" text-anchor="start">Heldout visual disagreements do not rewrite scores</text>
<rect x="619" y="793" width="535" height="150" rx="13" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.5"/>
<text x="639" y="825" class="head" text-anchor="start">Decision and handoff</text>
<text x="639" y="855" class="body" text-anchor="start">Default changes require the original 95% coverage gate</text>
<text x="639" y="880" class="body" text-anchor="start">Separate UI disclosure from implementation deletion</text>
<text x="639" y="905" class="body" text-anchor="start">Exact inventory + staged implementation plan</text>
<text x="639" y="930" class="body" text-anchor="start">Reports, raw outcomes, source and replay commands</text>
<path class="arrow" d="M581 864 L617 864"/>
<text x="46" y="983" class="head" text-anchor="start">Measurement boundaries</text>
<text x="46" y="1012" class="body" text-anchor="start">Synthetic frequencies are not market prevalence. Cloud time is not desktop latency. Oracle wins are not automatic choices.</text>
</svg>
