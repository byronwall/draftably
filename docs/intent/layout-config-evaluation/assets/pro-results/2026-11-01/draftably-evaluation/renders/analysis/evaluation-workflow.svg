<text x="46" y="52" class="title" text-anchor="start">Draftably: from immutable source to a bounded recommendation</text>
<text x="46" y="82" class="body" text-anchor="start">Actual shipped algorithms • frozen decisions • failures retained • no product changes</text>
<rect x="46" y="116" width="535" height="126" rx="13" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.5"/>
<text x="66" y="148" class="head" text-anchor="start">Immutable source</text>
<text x="66" y="178" class="body" text-anchor="start">Commit f14d9b891adba75de6cc172b190017ea5a5ca091</text>
<text x="66" y="203" class="body" text-anchor="start">451 original files verified; production compiler and renderer</text>
<text x="66" y="228" class="body" text-anchor="start">Separate stock checks and real browser flow evidence</text>
<rect x="619" y="116" width="535" height="126" rx="13" fill="#ffffff" stroke="#c7d5e3" stroke-width="1.5"/>
<text x="639" y="148" class="head" text-anchor="start">Corpus and user jobs</text>
<text x="639" y="178" class="body" text-anchor="start">72 bases / 12 families / 5 preference profiles</text>
<text x="639" y="203" class="body" text-anchor="start">48 development + 24 genuinely new heldout cases</text>
<text x="639" y="228" class="body" text-anchor="start">24 edit bases; frozen routing fixtures; explicit constraints</text>
<path d="M313 242V267H886V242 M221 267H979" fill="none" stroke="#62758a" stroke-width="2.4"/>
<path class="arrow" d="M221 267 L221 293"/>
