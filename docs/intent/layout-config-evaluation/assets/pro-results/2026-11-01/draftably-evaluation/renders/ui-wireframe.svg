<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><style>text{font-family:Inter,Arial,sans-serif;fill:#162235}.small{font-size:14px;fill:#536172}.label{font-size:15px;font-weight:600}.title{font-size:24px;font-weight:700}.body{font-size:16px}.line{stroke:#cbd5e1;stroke-width:1.4;fill:none}</style><rect width="1400" height="1000" fill="#f4f7fb"/><text x="34" y="43" class="title">Draftably · proposed editing controls</text><text x="34" y="70" class="small">Precise UI wireframe · proposal, not a screenshot or a measured usability result</text><rect x="24" y="92" width="1352" height="820" rx="8" fill="#fff" stroke="#cbd5e1"/><rect x="24" y="92" width="1352" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="46" y="127" class="label">Checkout architecture</text><rect x="502" y="101" width="110" height="38" rx="6" fill="#fff" stroke="#bac6d6"/><text x="514" y="126" class="label">Improve</text><rect x="624" y="101" width="132" height="38" rx="6" fill="#fff" stroke="#bac6d6"/><text x="636" y="126" class="label">Rearrange</text><rect x="768" y="101" width="110" height="38" rx="6" fill="#fff" stroke="#bac6d6"/><text x="780" y="126" class="label">Compare</text><text x="938" y="126" class="small">Undo  /  Redo</text><path d="M1014 148V912" class="line"/><text x="1044" y="185" class="title">Rearrange</text><text x="1044" y="212" class="small">Preview a new arrangement.</text><text x="1044" y="249" class="label">Scope</text><rect x="1044" y="261" width="304" height="42" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="1056" y="288" class="body">Whole diagram</text><text x="1324" y="288" class="body">▾</text><text x="1044" y="332" class="label">Reading direction</text><rect x="1044" y="344" width="304" height="42" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="1056" y="371" class="body">As authored</text><text x="1324" y="371" class="body">▾</text><text x="1044" y="415" class="label">Format</text><rect x="1044" y="427" width="304" height="42" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="1056" y="454" class="body">As authored</text><text x="1324" y="454" class="body">▾</text><text x="1044" y="507" class="small">Pins and named structure stay.</text><text x="1044" y="532" class="small">Existing refinements are listed</text><text x="1044" y="553" class="small">before a replacement is kept.</text><rect x="1044" y="580" width="304" height="38" rx="6" fill="#e4efff" stroke="#3568aa"/><text x="1056" y="605" class="label">Preview arrangement</text><rect x="1044" y="631" width="304" height="38" rx="6" fill="#fff" stroke="#bac6d6"/><text x="1056" y="656" class="label">Compare alternatives</text><text x="1044" y="703" class="label">▸ Advanced</text><text x="1063" y="731" class="small">Method · spacing · protection</text><text x="1063" y="754" class="small">All source values remain available.</text><text x="1044" y="811" class="label">Connections</text><rect x="1044" y="824" width="304" height="42" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="1056" y="851" class="body">Balanced</text><text x="1324" y="851" class="body">▾</text><text x="1044" y="891" class="small">Reroute     Compare connections</text><text x="54" y="191" class="small">Canvas</text><rect x="138" y="274" width="654" height="312" rx="12" fill="#f9fbff" stroke="#94b2d4"/><text x="159" y="306" class="label">Commerce services</text><rect x="182" y="378" width="138" height="60" rx="7" fill="#fff" stroke="#567da7"/><text x="196" y="415" class="label">Gateway</text><rect x="410" y="348" width="146" height="60" rx="7" fill="#fff" stroke="#567da7"/><text x="424" y="385" class="label">Orders</text><rect x="410" y="452" width="146" height="60" rx="7" fill="#fff" stroke="#567da7"/><text x="424" y="489" class="label">Billing</text><rect x="634" y="378" width="120" height="60" rx="7" fill="#fff" stroke="#567da7"/><text x="648" y="415" class="label">Database</text><path d="M320 408H365V378H410" stroke="#436d9e" stroke-width="2" fill="none"/><path d="M320 408H365V482H410" stroke="#436d9e" stroke-width="2" fill="none"/><path d="M556 378H596V408H634" stroke="#436d9e" stroke-width="2" fill="none"/><path d="M556 482H596V408H634" stroke="#436d9e" stroke-width="2" fill="none"/><text x="150" y="633" class="label">Connection Inspector (when selected)</text><rect x="138" y="651" width="654" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="155" y="680" class="body">From  [ Auto ▾ ]       To  [ Auto ▾ ]       Use auto ports</text><text x="155" y="712" class="small">Resolved sides shown; explicit sides stay unless deliberately released.</text><rect x="138" y="767" width="654" height="98" rx="8" fill="#fff8e9" stroke="#e8d4a8"/><text x="155" y="795" class="label">Preview pending · nothing saved</text><rect x="155" y="811" width="152" height="38" rx="6" fill="#fff" stroke="#bac6d6"/><text x="167" y="836" class="label">Hold before</text><rect x="321" y="811" width="125" height="38" rx="6" fill="#fff" stroke="#bac6d6"/><text x="333" y="836" class="label">Discard</text><rect x="460" y="811" width="146" height="38" rx="6" fill="#e4efff" stroke="#3568aa"/><text x="472" y="836" class="label">Keep layout</text><text x="35" y="949" class="label">Compare: current drawing + up to 3 meaningfully different alternatives; show hard defects before soft metrics.</text><text x="35" y="976" class="small">Improve and Rearrange remain separate actions. Sequence, lanes and cells remain explicit authored structures.</text></svg>