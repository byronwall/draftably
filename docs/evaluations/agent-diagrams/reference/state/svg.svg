<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="820" height="400" fill="#fff"/>
  <text x="410" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">Publishing state machine</text>

  <g fill="none" stroke="#333" stroke-width="1.5">
    <line x1="68" y1="185" x2="108" y2="185" marker-end="url(#arrow)"/>
    <line x1="250" y1="185" x2="358" y2="185" marker-end="url(#arrow)"/>
    <path d="M430,160 Q430,105 397,105" marker-end="url(#arrow)"/>
    <path d="M215,105 Q180,105 180,158" marker-end="url(#arrow)"/>
    <line x1="500" y1="185" x2="608" y2="185" marker-end="url(#arrow)"/>
    <line x1="680" y1="210" x2="680" y2="318" marker-end="url(#arrow)"/>
    <path d="M640,210 V265 H210 V212" marker-end="url(#arrow)"/>
    <line x1="610" y1="345" x2="502" y2="345" marker-end="url(#arrow)"/>
    <path d="M360,345 H150 V212" marker-end="url(#arrow)"/>
  </g>

  <circle cx="60" cy="185" r="8" fill="#333"/>

  <g font-family="sans-serif" font-size="13" fill="#555">
    <text x="305" y="177" text-anchor="middle">submit</text>
    <text x="440" y="130" text-anchor="start">request edits</text>
    <text x="172" y="130" text-anchor="end">revise</text>
    <text x="555" y="177" text-anchor="middle">approve</text>
    <text x="690" y="270" text-anchor="start">publish</text>
    <text x="430" y="258" text-anchor="middle">withdraw</text>
    <text x="555" y="337" text-anchor="middle">archive</text>
    <text x="270" y="337" text-anchor="middle">restore</text>
  </g>

  <g stroke="#333" stroke-width="1.5" fill="#fff">
    <rect x="110" y="160" width="140" height="50" rx="10" fill="#eef4ff"/>
    <rect x="360" y="160" width="140" height="50" rx="10" fill="#fff7e6"/>
    <rect x="215" y="80" width="180" height="50" rx="10" fill="#ffecec"/>
    <rect x="610" y="160" width="140" height="50" rx="10" fill="#eafaea"/>
    <rect x="610" y="320" width="140" height="50" rx="10" fill="#e6f7f7"/>
    <rect x="360" y="320" width="140" height="50" rx="10" fill="#f0f0f0"/>
  </g>

  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222">
    <text x="180" y="190">Draft</text>
    <text x="430" y="190">In review</text>
    <text x="305" y="110">Changes requested</text>
    <text x="680" y="190">Approved</text>
    <text x="680" y="350">Published</text>
    <text x="430" y="350">Archived</text>
  </g>
</svg>
