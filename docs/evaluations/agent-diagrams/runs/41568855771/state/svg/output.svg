<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title">
<title id="title">Publishing state machine</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
<rect width="1200" height="520" fill="#ffffff"/>
<text x="40" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Publishing state machine</text>
<g fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
<path d="M210 228 H290"/>
<path d="M360 256 V330"/>
<path d="M260 358 H140 V256"/>
<path d="M430 228 H530"/>
<path d="M670 228 H770"/>
<path d="M910 228 H1010"/>
<path d="M1080 256 V460 H30 V228 H70"/>
<path d="M600 200 V112 H140 V200"/>
</g>
<g font-family="Arial, sans-serif" font-size="15" fill="#334155" text-anchor="middle">
<text x="250" y="215">submit</text>
<text x="416" y="298">request edits</text>
<text x="200" y="347">revise</text>
<text x="480" y="215">approve</text>
<text x="720" y="215">publish</text>
<text x="960" y="215">archive</text>
<text x="600" y="449">restore</text>
<text x="370" y="101">withdraw</text>
</g>
<g fill="#f1f5f9" stroke="#334155" stroke-width="2">
<rect x="70" y="200" width="140" height="56" rx="12"/>
<rect x="290" y="200" width="140" height="56" rx="12"/>
<rect x="260" y="330" width="200" height="56" rx="12"/>
<rect x="530" y="200" width="140" height="56" rx="12"/>
<rect x="770" y="200" width="140" height="56" rx="12"/>
<rect x="1010" y="200" width="140" height="56" rx="12"/>
</g>
<g font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">
<text x="140" y="228">Draft</text>
<text x="360" y="228">In review</text>
<text x="360" y="358">Changes requested</text>
<text x="600" y="228">Approved</text>
<text x="840" y="228">Published</text>
<text x="1080" y="228">Archived</text>
</g>
</svg>
