<svg xmlns="http://www.w3.org/2000/svg" width="760" height="940" viewBox="0 0 760 940" role="img" aria-labelledby="title">
<title id="title">Order approval workflow</title>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#334155"/></marker>
<style>
text {font-family:Arial, sans-serif;fill:#172033;font-size:17px;text-anchor:middle;dominant-baseline:middle}
.node {fill:#f8fafc;stroke:#334155;stroke-width:2}
.decision {fill:#eff6ff;stroke:#334155;stroke-width:2}
.edge {fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
.label {font-size:15px;fill:#334155}
</style>
</defs>
<rect width="760" height="940" fill="#ffffff"/>
<text x="380" y="40" style="font-size:26px;font-weight:700">Order approval workflow</text>
<g class="edge">
<path d="M270 132 V170"/>
<path d="M270 222 V260"/>
<path d="M270 380 V425"/>
<path d="M430 320 H620 V655"/>
<path d="M270 477 V520"/>
<path d="M270 640 V685"/>
<path d="M420 580 H550 V655"/>
<path d="M270 737 V780"/>
<path d="M270 832 V875"/>
<path d="M585 707 V899 H340"/>
</g>
<rect class="node" x="200" y="84" width="140" height="48" rx="24"/>
<text x="270" y="108">Start</text>
<rect class="node" x="170" y="170" width="200" height="52" rx="7"/>
<text x="270" y="196">Validate order</text>
<path class="decision" d="M270 260 L430 320 L270 380 L110 320 Z"/>
<text x="270" y="320">Payment authorized?</text>
<rect class="node" x="170" y="425" width="200" height="52" rx="7"/>
<text x="270" y="451">Reserve stock</text>
<path class="decision" d="M270 520 L420 580 L270 640 L120 580 Z"/>
<text x="270" y="580">Stock available?</text>
<rect class="node" x="170" y="685" width="200" height="52" rx="7"/>
<text x="270" y="711">Pack order</text>
<rect class="node" x="170" y="780" width="200" height="52" rx="7"/>
<text x="270" y="806">Ship order</text>
<rect class="node" x="495" y="655" width="180" height="52" rx="7"/>
<text x="585" y="681">Cancel order</text>
<rect class="node" x="200" y="875" width="140" height="48" rx="24"/>
<text x="270" y="899">End</text>
<text class="label" x="295" y="402">yes</text>
<text class="label" x="480" y="305">no</text>
<text class="label" x="295" y="662">yes</text>
<text class="label" x="470" y="565">no</text>
</svg>
